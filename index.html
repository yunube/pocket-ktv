<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>YUNUBE KTV // Y3K LIVE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Serif+TC:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --y3k-cyan: #00f0ff;
      --y3k-pink: #ff007f;
      --y3k-violet: #8a2be2;
      --y3k-chrome: #e0e6ed;
      --void-black: #04060b;
      --liquid-panel: rgba(14, 18, 28, 0.72);
      --holo-border: rgba(0, 240, 255, 0.28);
      --metal-gradient: linear-gradient(135deg, #ffffff 0%, #b8c4d4 40%, #566479 100%);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Space Grotesk', 'Plus Jakarta Sans', 'Noto Serif TC', sans-serif;
      background-color: var(--void-black);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(0, 240, 255, 0.16) 0%, transparent 45%),
        radial-gradient(circle at 90% 90%, rgba(255, 0, 127, 0.16) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(138, 43, 226, 0.12) 0%, transparent 60%),
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 40px 40px, 40px 40px;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 18px 12px;
    }

    /* Y3K 外骨骼液態金屬底座 */
    .y3k-capsule {
      width: 100%;
      max-width: 480px;
      background: var(--liquid-panel);
      backdrop-filter: blur(32px) saturate(200%);
      -webkit-backdrop-filter: blur(32px) saturate(200%);
      border: 1px solid var(--holo-border);
      border-radius: 36px;
      padding: 24px;
      box-shadow: 
        0 30px 80px rgba(0, 0, 0, 0.9),
        0 0 50px rgba(0, 240, 255, 0.18),
        inset 0 1px 2px rgba(255, 255, 255, 0.4),
        inset 0 -1px 2px rgba(0, 240, 255, 0.2);
      position: relative;
    }

    /* 頂部全息發光標頭 */
    .y3k-brand-hub {
      text-align: center;
      margin-bottom: 20px;
      position: relative;
    }

    .y3k-tag {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--y3k-cyan);
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.4);
      padding: 3px 12px;
      border-radius: 100px;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
      margin-bottom: 6px;
    }

    .brand-title {
      font-family: 'Dela Gothic One', 'Noto Serif TC', sans-serif;
      font-size: 2.1rem;
      letter-spacing: 4px;
      background: linear-gradient(180deg, #ffffff 0%, #d8e5ff 40%, var(--y3k-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
      filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.5));
    }

    .brand-eng {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 5px;
      color: var(--y3k-pink);
      text-transform: uppercase;
      margin-top: 2px;
      text-shadow: 0 0 10px rgba(255, 0, 127, 0.8);
    }

    .earphone-alert {
      background: rgba(255, 0, 127, 0.08);
      border: 1px solid rgba(255, 0, 127, 0.3);
      color: #ffc2df;
      padding: 9px 14px;
      border-radius: 16px;
      font-size: 0.76rem;
      line-height: 1.45;
      margin-bottom: 18px;
      backdrop-filter: blur(12px);
    }

    /* Y3K 玻璃未來面板 */
    .holo-deck {
      background: rgba(8, 12, 20, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 22px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 
        inset 0 0 20px rgba(255, 255, 255, 0.02),
        0 10px 30px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }

    .holo-deck:hover {
      border-color: rgba(0, 240, 255, 0.4);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
    }

    .deck-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .deck-title {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
    }

    .deck-status {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--y3k-cyan);
      letter-spacing: 1px;
    }

    /* 液態金屬與水銀按鈕 */
    button {
      font-family: 'Space Grotesk', 'Plus Jakarta Sans', sans-serif;
      font-size: 0.86rem;
      font-weight: 800;
      padding: 12px 18px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      width: 100%;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* 主按鍵：液態金屬流動光 */
    .btn-liquid-metal {
      background: linear-gradient(135deg, #ffffff 0%, #b8c4d4 30%, #ff007f 100%);
      color: #04060b;
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.4), inset 0 1px 1px #fff;
    }
    .btn-liquid-metal:active {
      transform: scale(0.97);
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
    }
    .btn-liquid-metal.active {
      background: linear-gradient(135deg, #00f0ff 0%, #7000ff 100%);
      color: #fff;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.6), inset 0 1px 1px #fff;
    }

    /* 輔助按鍵：微透冰晶白 */
    .btn-holo-sub {
      background: rgba(255, 255, 255, 0.06);
      color: var(--y3k-chrome);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 9px 16px;
      width: auto;
      font-size: 0.78rem;
    }
    .btn-holo-sub:hover, .btn-holo-sub:active {
      border-color: var(--y3k-cyan);
      color: #fff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    }

    /* 量子音波高頻動態條 (Quantum Meter) */
    .quantum-track {
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 100px;
      overflow: hidden;
      margin: 12px 0 14px 0;
      position: relative;
    }
    .quantum-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--y3k-cyan), var(--y3k-pink));
      border-radius: 100px;
      transition: width 0.05s ease-out;
      box-shadow: 0 0 12px var(--y3k-cyan);
    }

    /* 極簡流線型阻尼推桿 */
    .slider-capsule {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 9px 14px;
      margin-top: 8px;
    }
    .slider-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: #8fa0b5;
      min-width: 82px;
    }
    .slider-digits {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--y3k-cyan);
      min-width: 44px;
      text-align: right;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
    }
    input[type="range"] {
      flex: 1;
      margin: 0 10px;
      accent-color: var(--y3k-pink);
      height: 4px;
    }

    /* 膠囊輸入列 */
    .input-flow-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.85rem;
      outline: none;
      transition: border 0.2s;
    }
    input[type="text"]:focus {
      border-color: var(--y3k-cyan);
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.35);
    }

    .network-badge {
      font-size: 0.78rem;
      color: var(--y3k-cyan);
      margin-top: 6px;
      word-break: break-all;
    }

    /* 全息影音視窗 (Holo Screen) */
    .holo-screen-frame {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 18px;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin-top: 10px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
    }
    .holo-screen-frame iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 手機解鎖全息條 */
    .holo-unmute-cue {
      background: linear-gradient(90deg, #7000ff, #ff007f);
      color: #fff;
      font-weight: 800;
      padding: 11px;
      border-radius: 14px;
      font-size: 0.8rem;
      text-align: center;
      margin-top: 8px;
      cursor: pointer;
      display: none;
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.5);
      animation: pulse3K 1.5s infinite alternate;
    }
    @keyframes pulse3K {
      from { transform: scale(1); filter: brightness(1); }
      to { transform: scale(1.02); filter: brightness(1.2); }
    }

    /* Y3K 播放清單卡槽 */
    .holo-stream-list {
      margin-top: 10px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 14px;
      padding: 6px 10px;
      max-height: 140px;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .stream-node {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      padding: 8px 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .stream-node:last-child { border-bottom: none; }
    .stream-node.streaming-active {
      color: var(--y3k-cyan);
      font-weight: 800;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
    }
    .empty-stream {
      color: #5d6b82;
      text-align: center;
      font-size: 0.75rem;
      padding: 12px;
    }

    #remoteAudio { display: none; }
  </style>
</head>
<body>

  <div class="y3k-capsule">
    <!-- 頂部 Y3K 招牌 -->
    <div class="y3k-brand-hub">
      <div class="y3k-tag">CORE SYSTEM // YEAR 3000</div>
      <div class="brand-title">YUNUBE大舞廳</div>
      <div class="brand-eng">YUNUBE KTV // Y3K VIRTUAL</div>
    </div>

    <div class="earphone-alert">
      ⚡ <strong>超頻連線提示：請配戴有線耳機！</strong><br>
      若在 iPhone 上覺得伴奏過大，可利用實體側鍵調低總量，並將下方「耳返增益」向右推大。
    </div>

    <!-- 1. 歌手監聽與調音台 -->
    <div class="holo-deck">
      <div class="deck-head">
        <span class="deck-title">🎚️ 歌手量子耳返</span>
        <span class="deck-status">NEURAL LINK</span>
      </div>

      <button id="micToggleBtn" class="btn-liquid-metal">啟動神經監聽耳返 (MIC MONITOR)</button>
      
      <!-- 量子音波柱 -->
      <div class="quantum-track">
        <div class="quantum-bar" id="vuMeter"></div>
      </div>

      <!-- 耳返增益放大 -->
      <div class="slider-capsule">
        <span class="slider-title">🎙️ 耳返增益</span>
        <input type="range" id="micVolume" min="0" max="5" step="0.1" value="1.8">
        <span class="slider-digits" id="micVal">180%</span>
      </div>

      <!-- 預設壓低至 25% 防止爆音 -->
      <div class="slider-capsule">
        <span class="slider-title">🎵 伴奏音量</span>
        <input type="range" id="musicVolume" min="0" max="1" step="0.05" value="0.25">
        <span class="slider-digits" id="musicVal">25%</span>
      </div>
    </div>

    <!-- 2. 包廂配對連線 -->
    <div class="holo-deck">
      <div class="deck-head">
        <span class="deck-title">👥 多維次元包廂</span>
        <span class="deck-status">P2P TUNNEL</span>
      </div>
      
      <button class="btn-holo-sub" id="createRoomBtn" style="width: 100%; margin-bottom: 8px;">開立虛擬包廂 (HOST)</button>
      
      <div class="input-flow-row">
        <input type="text" id="joinRoomInput" placeholder="輸入好友包廂代碼...">
        <button class="btn-holo-sub" id="joinRoomBtn">連線 (JOIN)</button>
      </div>

      <div class="network-badge" id="roomStatus">系統離線中</div>
    </div>

    <!-- 3. 伴奏點歌甲板 -->
    <div class="holo-deck">
      <div class="deck-head">
        <span class="deck-title">🎵 全息影音點播機</span>
        <span class="deck-status">HOLO DECK</span>
      </div>

      <div class="input-flow-row">
        <input type="text" id="ytUrlInput" placeholder="貼上 YouTube 伴奏/KTV 網址...">
        <button class="btn-holo-sub" id="addQueueBtn">點歌</button>
      </div>

      <!-- 手機端解除限制提示 -->
      <div class="holo-unmute-cue" id="unmuteTip">
        ✨ 伴奏已就緒！點此解鎖全息螢幕與聲音 🔊
      </div>

      <div class="holo-screen-frame">
        <div id="ytPlayer"></div>
      </div>

      <div style="display: flex; gap: 8px; margin-top: 10px;">
        <button class="btn-holo-sub" id="syncFixBtn" style="flex: 1; border-color: rgba(0, 240, 255, 0.4); color: var(--y3k-cyan);">🔄 秒數精準對齊</button>
        <button class="btn-holo-sub" id="nextSongBtn" style="flex: 1; border-color: rgba(255, 0, 127, 0.4); color: var(--y3k-pink);">⏭️ 切歌 / 下一首</button>
      </div>

      <div class="deck-head" style="margin-top: 14px; margin-bottom: 4px;">
        <span style="font-size: 0.74rem; font-weight: 700; color: #8fa0b5;">DATASTREAM // 預約序列</span>
      </div>
      <div class="holo-stream-list" id="playlistBox">
        <div class="empty-stream">序列待命中，請貼上 YouTube 伴奏連結</div>
      </div>
    </div>
  </div>

  <audio id="remoteAudio" autoplay playsinline></audio>

  <!-- 外部函式庫 -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    /* ====================================================
       1. 音訊核心、耳返監聽與量子聲波柱
       ==================================================== */
    let audioCtx = null;
    let micStream = null;
    let micGainNode = null;
    let analyserNode = null;
    let isMonitoring = false;
    let animFrameId = null;

    const micBtn = document.getElementById('micToggleBtn');
    const micVolSlider = document.getElementById('micVolume');
    const micValDisplay = document.getElementById('micVal');
    const musicVolSlider = document.getElementById('musicVolume');
    const musicValDisplay = document.getElementById('musicVal');
    const vuMeter = document.getElementById('vuMeter');

    async function ensureAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass({ latencyHint: 'interactive', sampleRate: 48000 });
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }
    }

    function updateVUMeter() {
      if (!analyserNode || !isMonitoring) {
        vuMeter.style.width = '0%';
        return;
      }
      const dataArray = new Uint8Array(analyserNode.frequencyBinCount);
      analyserNode.getByteFrequencyData(dataArray);

      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
      let percent = Math.min(100, Math.round((sum / dataArray.length / 128) * 100 * 1.5));
      vuMeter.style.width = percent + '%';
      animFrameId = requestAnimationFrame(updateVUMeter);
    }

    micBtn.addEventListener('click', async () => {
      await ensureAudioContext();
      if (!isMonitoring) {
        try {
          if (!micStream) {
            micStream = await navigator.mediaDevices.getUserMedia({
              audio: { echoCancellation: false, autoGainControl: false, noiseSuppression: false, latency: 0 }
            });
          }

          const micSource = audioCtx.createMediaStreamSource(micStream);
          micGainNode = audioCtx.createGain();
          micGainNode.gain.value = parseFloat(micVolSlider.value);

          analyserNode = audioCtx.createAnalyser();
          analyserNode.fftSize = 64;

          micSource.connect(micGainNode);
          micGainNode.connect(analyserNode);
          analyserNode.connect(audioCtx.destination);

          isMonitoring = true;
          micBtn.textContent = '🔊 神經連結監聽中 (LINKED)';
          micBtn.classList.add('active');
          updateVUMeter();
        } catch (err) {
          alert('無法取得麥克風，請檢查權限！');
        }
      } else {
        if (micStream) {
          micStream.getTracks().forEach(t => t.stop());
          micStream = null;
        }
        isMonitoring = false;
        cancelAnimationFrame(animFrameId);
        vuMeter.style.width = '0%';
        micBtn.textContent = '啟動神經監聽耳返 (MIC MONITOR)';
        micBtn.classList.remove('active');
      }
    });

    micVolSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      micValDisplay.textContent = Math.round(val * 100) + '%';
      if (micGainNode) micGainNode.gain.value = val;
    });

    musicVolSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      musicValDisplay.textContent = Math.round(val * 100) + '%';
      if (ytPlayer && typeof ytPlayer.setVolume === 'function') {
        ytPlayer.setVolume(val * 100);
      }
    });

    /* ====================================================
       2. YouTube 播放器與全息預約序列
       ==================================================== */
    let playlist = [];
    let currentSongIndex = -1;
    let ytPlayer = null;
    let isPlayerReady = false;
    let isInternalAction = false;

    const playlistBox = document.getElementById('playlistBox');
    const unmuteTip = document.getElementById('unmuteTip');
    const ytUrlInput = document.getElementById('ytUrlInput');
    const addQueueBtn = document.getElementById('addQueueBtn');
    const nextSongBtn = document.getElementById('nextSongBtn');
    const syncFixBtn = document.getElementById('syncFixBtn');

    function renderPlaylist() {
      if (playlist.length === 0) {
        playlistBox.innerHTML = '<div class="empty-stream">序列待命中，請貼上 YouTube 伴奏連結</div>';
        return;
      }
      let html = '';
      playlist.forEach((item, index) => {
        let tag = `#${index + 1}`;
        let itemClass = 'stream-node';
        if (index === currentSongIndex) {
          tag = 'STREAMING';
          itemClass += ' streaming-active';
        } else if (index === currentSongIndex + 1) {
          tag = 'NEXT';
        }
        html += `<div class="${itemClass}"><span>[${tag}] ${item.title}</span></div>`;
      });
      playlistBox.innerHTML = html;
    }

    function extractVideoID(url) {
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      return match ? match[1] : null;
    }

    window.onYouTubeIframeAPIReady = function() {
      ytPlayer = new YT.Player('ytPlayer', {
        height: '100%',
        width: '100%',
        playerVars: {
          autoplay: 1,
          playsinline: 1,
          enablejsapi: 1,
          origin: window.location.origin || '*'
        },
        events: {
          onReady: (event) => {
            isPlayerReady = true;
            event.target.setVolume(25); // 預設安全音量 25%
          },
          onStateChange: (event) => {
            if (isInternalAction) return;
            if (event.data === YT.PlayerState.ENDED) {
              playNextSong();
            } else if (event.data === YT.PlayerState.PLAYING) {
              broadcastControl('PLAY', ytPlayer.getCurrentTime());
            } else if (event.data === YT.PlayerState.PAUSED) {
              broadcastControl('PAUSE', ytPlayer.getCurrentTime());
            }
          }
        }
      });
    };

    function playVideo(videoId, startSeconds = 0) {
      if (!isPlayerReady || !ytPlayer) {
        setTimeout(() => playVideo(videoId, startSeconds), 400);
        return;
      }
      unmuteTip.style.display = 'block';

      try {
        isInternalAction = true;
        ytPlayer.loadVideoById({ videoId: videoId, startSeconds: startSeconds });
        ytPlayer.setVolume(parseFloat(musicVolSlider.value) * 100);
        ytPlayer.playVideo();
        setTimeout(() => { isInternalAction = false; }, 800);
      } catch (e) {
        console.warn('等待手機觸碰解鎖', e);
      }
    }

    unmuteTip.addEventListener('click', () => {
      if (ytPlayer && playlist[currentSongIndex]) {
        isInternalAction = true;
        ytPlayer.loadVideoById(playlist[currentSongIndex].id);
        ytPlayer.playVideo();
        setTimeout(() => { isInternalAction = false; }, 800);
      }
      unmuteTip.style.display = 'none';
    });

    function playTrackAtIndex(index, startSeconds = 0) {
      if (index >= 0 && index < playlist.length) {
        currentSongIndex = index;
        renderPlaylist();
        playVideo(playlist[currentSongIndex].id, startSeconds);
      }
    }

    function playNextSong() {
      if (currentSongIndex + 1 < playlist.length) {
        playTrackAtIndex(currentSongIndex + 1, 0);
        broadcastFullState();
      } else {
        alert('次元序列曲目已全數播畢！');
      }
    }

    nextSongBtn.addEventListener('click', playNextSong);

    syncFixBtn.addEventListener('click', () => {
      if (ytPlayer && typeof ytPlayer.getCurrentTime === 'function') {
        const currTime = ytPlayer.getCurrentTime();
        broadcastControl('SEEK', currTime);
        alert('已向全包廂重新校準秒數：' + Math.round(currTime) + ' 秒');
      }
    });

    addQueueBtn.addEventListener('click', () => {
      const url = ytUrlInput.value.trim();
      const videoId = extractVideoID(url);
      if (!videoId) {
        alert('請輸入合法的 YouTube 網址！');
        return;
      }

      const songItem = { id: videoId, title: '伴奏序列 (' + videoId.substring(0, 6) + ')' };
      playlist.push(songItem);
      ytUrlInput.value = '';

      if (currentSongIndex === -1) {
        currentSongIndex = 0;
        playTrackAtIndex(0, 0);
      } else {
        renderPlaylist();
      }
      broadcastFullState();
    });

    /* ====================================================
       3. 雙向包廂連線網路層
       ==================================================== */
    let peer = null;
    let activeConnections = [];
    const roomStatus = document.getElementById('roomStatus');
    const createRoomBtn = document.getElementById('createRoomBtn');
    const joinRoomBtn = document.getElementById('joinRoomBtn');
    const joinRoomInput = document.getElementById('joinRoomInput');
    const remoteAudio = document.getElementById('remoteAudio');

    function broadcastFullState() {
      const currentTime = (ytPlayer && typeof ytPlayer.getCurrentTime === 'function') ? ytPlayer.getCurrentTime() : 0;
      const payload = {
        type: 'FULL_STATE',
        playlist: playlist,
        currentSongIndex: currentSongIndex,
        currentTime: currentTime
      };
      activeConnections.forEach(conn => {
        if (conn && conn.open) conn.send(payload);
      });
    }

    function broadcastControl(action, time) {
      const payload = { type: 'MEDIA_CONTROL', action: action, time: time };
      activeConnections.forEach(conn => {
        if (conn && conn.open) conn.send(payload);
      });
    }

    function handleIncomingData(data) {
      if (data.type === 'FULL_STATE') {
        playlist = data.playlist || [];
        const prevIndex = currentSongIndex;
        currentSongIndex = data.currentSongIndex;
        renderPlaylist();

        if (currentSongIndex !== -1 && currentSongIndex !== prevIndex) {
          if (playlist[currentSongIndex]) {
            playVideo(playlist[currentSongIndex].id, data.currentTime || 0);
          }
        }
      } else if (data.type === 'MEDIA_CONTROL') {
        if (!ytPlayer) return;
        isInternalAction = true;
        if (data.action === 'PLAY') {
          if (Math.abs(ytPlayer.getCurrentTime() - data.time) > 2) {
            ytPlayer.seekTo(data.time, true);
          }
          ytPlayer.playVideo();
        } else if (data.action === 'PAUSE') {
          ytPlayer.pauseVideo();
        } else if (data.action === 'SEEK') {
          ytPlayer.seekTo(data.time, true);
        }
        setTimeout(() => { isInternalAction = false; }, 600);
      }
    }

    function registerConn(conn) {
      if (!activeConnections.includes(conn)) {
        activeConnections.push(conn);
      }
      conn.on('open', () => {
        roomStatus.innerHTML = '<span style="color:var(--y3k-cyan);font-weight:700;">✨ 次元通道連結成功 (CONNECTED)</span>';
        broadcastFullState();
      });
      conn.on('data', handleIncomingData);
      conn.on('close', () => {
        activeConnections = activeConnections.filter(c => c !== conn);
      });
    }

    function setupPeer() {
      if (!peer) {
        peer = new Peer();

        peer.on('call', async (call) => {
          await ensureAudioContext();
          if (!micStream) {
            micStream = await navigator.mediaDevices.getUserMedia({
              audio: { echoCancellation: false, latency: 0 }
            });
          }
          call.answer(micStream);
          call.on('stream', (remoteStream) => {
            remoteAudio.srcObject = remoteStream;
          });
        });

        peer.on('connection', registerConn);
      }
    }

    createRoomBtn.addEventListener('click', () => {
      setupPeer();
      peer.on('open', (id) => {
        roomStatus.innerHTML = `次元包廂代碼：<br><strong style="color:var(--y3k-pink);font-family:'Space Grotesk';font-size:1.15rem;letter-spacing:1px;">${id}</strong>`;
      });
    });

    joinRoomBtn.addEventListener('click', async () => {
      const targetId = joinRoomInput.value.trim();
      if (!targetId) {
        alert('請輸入包廂代碼！');
        return;
      }
      setupPeer();
      await ensureAudioContext();
      if (!micStream) {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, latency: 0 }
        });
      }

      const conn = peer.connect(targetId);
      registerConn(conn);

      const call = peer.call(targetId, micStream);
      call.on('stream', (remoteStream) => {
        remoteAudio.srcObject = remoteStream;
      });

      roomStatus.innerHTML = `<span style="color:var(--y3k-cyan);font-weight:700;">✨ 已切換至目標次元：${targetId}</span>`;
    });
  </script>
</body>
</html>
