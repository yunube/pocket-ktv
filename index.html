<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>YUNUBE KTV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --neon-pink: #ff007f;
      --neon-cyan: #00f3ff;
      --neon-purple: #9d00ff;
      --neon-yellow: #f8e71c;
      --dark-bg: #09090e;
      --panel-bg: rgba(18, 18, 28, 0.85);
      --border-glow: rgba(0, 243, 255, 0.3);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Rajdhani', 'Noto Sans TC', -apple-system, sans-serif;
      background-color: var(--dark-bg);
      background-image: 
        linear-gradient(rgba(0, 243, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 0, 127, 0.04) 1px, transparent 1px);
      background-size: 30px 30px;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }

    .cyber-frame {
      width: 100%;
      max-width: 520px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-glow);
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 0 35px rgba(0, 243, 255, 0.15), inset 0 0 20px rgba(255, 0, 127, 0.05);
      position: relative;
    }

    /* 頂部賽博霓虹招牌 */
    .brand-title {
      font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      text-align: center;
      letter-spacing: 4px;
      color: #fff;
      text-transform: uppercase;
      margin: 0 0 4px 0;
      text-shadow: 
        0 0 7px #fff,
        0 0 14px var(--neon-pink),
        0 0 25px var(--neon-pink),
        0 0 40px var(--neon-purple);
    }

    .brand-subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: var(--neon-cyan);
      letter-spacing: 3px;
      margin-bottom: 16px;
      opacity: 0.9;
      text-transform: uppercase;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
    }

    .warning-box {
      background: rgba(248, 231, 28, 0.08);
      border: 1px dashed var(--neon-yellow);
      color: var(--neon-yellow);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      margin-bottom: 14px;
      line-height: 1.4;
      text-shadow: 0 0 8px rgba(248, 231, 28, 0.4);
    }

    .cyber-panel {
      background: rgba(10, 10, 18, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 3px solid var(--neon-cyan);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
      position: relative;
    }

    .panel-header {
      font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--neon-cyan);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    button {
      font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
      letter-spacing: 1px;
      font-size: 0.85rem;
      padding: 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: bold;
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn-neon-pink {
      background: linear-gradient(135deg, #ff007f, #b30059);
      color: #fff;
      box-shadow: 0 0 14px rgba(255, 0, 127, 0.4);
    }

    .btn-neon-pink:active {
      transform: scale(0.98);
      box-shadow: 0 0 22px rgba(255, 0, 127, 0.8);
    }

    .btn-neon-pink.active {
      background: linear-gradient(135deg, #00f3ff, #0099ff);
      color: #000;
      box-shadow: 0 0 16px rgba(0, 243, 255, 0.7);
    }

    .btn-sub {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      width: auto;
      padding: 8px 12px;
      font-size: 0.8rem;
    }

    .btn-sub:hover, .btn-sub:active {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    }

    .btn-next {
      background: linear-gradient(135deg, #f39c12, #e74c3c);
      color: #fff;
      margin-top: 8px;
      box-shadow: 0 0 12px rgba(243, 156, 18, 0.3);
    }

    /* 音量動態跳動條 (VU Meter) */
    .vu-meter-bar {
      height: 6px;
      background: #111;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .vu-meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00f3ff, #f8e71c 70%, #ff007f 90%);
      transition: width 0.05s ease-out;
      box-shadow: 0 0 8px #00f3ff;
    }

    .fader-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 0.85rem;
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .fader-label {
      color: #aaa;
      min-width: 80px;
      font-size: 0.8rem;
    }
    .fader-val {
      min-width: 45px;
      text-align: right;
      font-family: 'Orbitron', monospace;
      color: var(--neon-cyan);
      font-size: 0.8rem;
    }
    input[type="range"] {
      flex: 1;
      margin: 0 10px;
      accent-color: var(--neon-pink);
    }

    .input-line {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    input[type="text"] {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-family: 'Rajdhani', 'Noto Sans TC', sans-serif;
      font-size: 0.9rem;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
    }

    .room-badge {
      font-size: 0.85rem;
      color: var(--neon-cyan);
      margin-top: 6px;
      word-break: break-all;
    }

    .video-deck {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
      border: 1px solid var(--neon-pink);
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.2);
      margin-top: 10px;
    }
    .video-deck iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .unmute-alert {
      background: linear-gradient(90deg, #9d00ff, #ff007f);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 8px;
      cursor: pointer;
      display: none;
      animation: pulseGlow 1.2s infinite alternate;
    }
    @keyframes pulseGlow {
      from { box-shadow: 0 0 8px #9d00ff; }
      to { box-shadow: 0 0 20px #ff007f; }
    }

    .track-list {
      margin-top: 10px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 6px;
      padding: 8px;
      max-height: 170px;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .track-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      padding: 6px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .track-item.playing {
      color: var(--neon-cyan);
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
      border-left: 2px solid var(--neon-cyan);
      padding-left: 8px;
    }
    .empty-queue {
      color: #666;
      text-align: center;
      font-size: 0.8rem;
      padding: 12px;
    }
    #remoteAudio { display: none; }
  </style>
</head>
<body>

  <div class="cyber-frame">
    <!-- 主招牌中文與英文名稱 -->
    <div class="brand-title">YUNUBE大舞廳</div>
    <div class="brand-subtitle">// YUNUBE KTV //</div>

    <div class="warning-box">
      ⚠️ <strong>必須佩戴有線耳機！</strong> 外放喇叭會將聲波反覆震盪收錄，引發高頻尖叫嘯叫。
    </div>

    <!-- 1. 歌手監聽調音台 -->
    <div class="cyber-panel">
      <div class="panel-header">
        <span>[01] MONITOR & MIXER</span>
        <span style="font-size: 0.7rem; color: #777;">LOW-LATENCY</span>
      </div>

      <button id="micToggleBtn" class="btn-neon-pink">啟動監聽耳返 (MIC MONITOR)</button>
      
      <!-- 動態音量跳動條 (歌聲響度計) -->
      <div class="vu-meter-bar">
        <div class="vu-meter-fill" id="vuMeter"></div>
      </div>

      <div class="fader-row">
        <span class="fader-label">🎙️ 耳返音量</span>
        <input type="range" id="micVolume" min="0" max="2" step="0.05" value="1">
        <span class="fader-val" id="micVal">100%</span>
      </div>

      <div class="fader-row">
        <span class="fader-label">🎵 伴奏音量</span>
        <input type="range" id="musicVolume" min="0" max="1" step="0.05" value="0.8">
        <span class="fader-val" id="musicVal">80%</span>
      </div>
    </div>

    <!-- 2. 包廂配對連線 -->
    <div class="cyber-panel" style="border-left-color: var(--neon-purple);">
      <div class="panel-header">
        <span style="color: var(--neon-purple);">[02] NET-LINK ROOM</span>
        <span style="font-size: 0.7rem; color: #777;">PEER P2P</span>
      </div>
      
      <button class="btn-sub" id="createRoomBtn" style="width: 100%; margin-bottom: 8px;">建立舞廳包廂 (HOST)</button>
      
      <div class="input-line">
        <input type="text" id="joinRoomInput" placeholder="輸入好友包廂代碼...">
        <button class="btn-sub" id="joinRoomBtn">連線 (JOIN)</button>
      </div>

      <div class="room-badge" id="roomStatus">舞廳離線中</div>
    </div>

    <!-- 3. 伴奏點歌甲板 -->
    <div class="cyber-panel" style="border-left-color: var(--neon-pink);">
      <div class="panel-header">
        <span style="color: var(--neon-pink);">[03] MEDIA DECK</span>
        <span style="font-size: 0.7rem; color: #777;">YOUTUBE SYNC</span>
      </div>

      <div class="input-line">
        <input type="text" id="ytUrlInput" placeholder="貼上 YouTube 伴奏/KTV 網址...">
        <button class="btn-sub" id="addQueueBtn">點歌</button>
      </div>

      <div class="unmute-alert" id="unmuteTip">
        ⚡ 伴奏已就緒！點此解鎖同步影音播放 🔊
      </div>

      <div class="video-deck">
        <div id="ytPlayer"></div>
      </div>

      <button class="btn-next" id="nextSongBtn">⏭️ 切歌 / 下一首 (SKIP TRACK)</button>

      <div class="panel-header" style="margin-top: 14px; font-size: 0.75rem;">
        <span>QUEUE // 舞廳歌單</span>
      </div>
      <div class="track-list" id="playlistBox">
        <div class="empty-queue">歌單待命中，請貼上 YouTube 伴奏網址加入佇列</div>
      </div>
    </div>
  </div>

  <audio id="remoteAudio" autoplay playsinline></audio>

  <!-- 外部函式庫 -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    /* ====================================================
       1. 音訊核心、耳返監聽與即時 VU Meter 跳動條
       ==================================================== */
    let audioCtx = null;
    let micStream = null;
    let micGainNode = null;
    let analyserNode = null;
    let isMonitoring = false;
    let animFrameId = null;

    const micBtn = document.getElementById('micToggleBtn');
    const micVolSlider = document.getElementById('micVolume');
    const micValDisplay = document.getElementById('micVal');
    const musicVolSlider = document.getElementById('musicVolume');
    const musicValDisplay = document.getElementById('musicVal');
    const vuMeter = document.getElementById('vuMeter');

    async function ensureAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass({ latencyHint: 'interactive', sampleRate: 48000 });
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }
    }

    function updateVUMeter() {
      if (!analyserNode || !isMonitoring) {
        vuMeter.style.width = '0%';
        return;
      }
      const dataArray = new Uint8Array(analyserNode.frequencyBinCount);
      analyserNode.getByteFrequencyData(dataArray);

      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) {
        sum += dataArray[i];
      }
      let avg = sum / dataArray.length;
      let percent = Math.min(100, Math.round((avg / 128) * 100 * 1.5));
      vuMeter.style.width = percent + '%';

      animFrameId = requestAnimationFrame(updateVUMeter);
    }

    micBtn.addEventListener('click', async () => {
      await ensureAudioContext();
      if (!isMonitoring) {
        try {
          if (!micStream) {
            micStream = await navigator.mediaDevices.getUserMedia({
              audio: { echoCancellation: false, autoGainControl: false, noiseSuppression: false, latency: 0 }
            });
          }

          const micSource = audioCtx.createMediaStreamSource(micStream);
          micGainNode = audioCtx.createGain();
          micGainNode.gain.value = parseFloat(micVolSlider.value);

          analyserNode = audioCtx.createAnalyser();
          analyserNode.fftSize = 64;

          micSource.connect(micGainNode);
          micGainNode.connect(analyserNode);
          analyserNode.connect(audioCtx.destination);

          isMonitoring = true;
          micBtn.textContent = '🔊 舞廳監聽中 (MONITOR ACTIVE)';
          micBtn.classList.add('active');
          updateVUMeter();
        } catch (err) {
          alert('無法取得麥克風，請檢查權限！');
        }
      } else {
        if (micStream) {
          micStream.getTracks().forEach(t => t.stop());
          micStream = null;
        }
        isMonitoring = false;
        cancelAnimationFrame(animFrameId);
        vuMeter.style.width = '0%';
        micBtn.textContent = '啟動監聽耳返 (MIC MONITOR)';
        micBtn.classList.remove('active');
      }
    });

    micVolSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      micValDisplay.textContent = Math.round(val * 100) + '%';
      if (micGainNode) micGainNode.gain.value = val;
    });

    musicVolSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      musicValDisplay.textContent = Math.round(val * 100) + '%';
      if (ytPlayer && typeof ytPlayer.setVolume === 'function') {
        ytPlayer.setVolume(val * 100);
      }
    });

    /* ====================================================
       2. 待播清單與 YouTube 播放器控制
       ==================================================== */
    let playlist = [];
    let currentSongIndex = -1;
    let ytPlayer = null;
    let isPlayerReady = false;

    const playlistBox = document.getElementById('playlistBox');
    const unmuteTip = document.getElementById('unmuteTip');
    const ytUrlInput = document.getElementById('ytUrlInput');
    const addQueueBtn = document.getElementById('addQueueBtn');
    const nextSongBtn = document.getElementById('nextSongBtn');

    function renderPlaylist() {
      if (playlist.length === 0) {
        playlistBox.innerHTML = '<div class="empty-queue">歌單待命中，請貼上 YouTube 伴奏網址加入佇列</div>';
        return;
      }
      let html = '';
      playlist.forEach((item, index) => {
        let tag = `#${index + 1}`;
        let itemClass = 'track-item';
        if (index === currentSongIndex) {
          tag = '▶ 舞廳正熱播';
          itemClass += ' playing';
        } else if (index === currentSongIndex + 1) {
          tag = 'NEXT';
        }
        html += `<div class="${itemClass}">
          <span>[${tag}] ${item.title}</span>
        </div>`;
      });
      playlistBox.innerHTML = html;
    }

    function extractVideoID(url) {
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      return match ? match[1] : null;
    }

    window.onYouTubeIframeAPIReady = function() {
      ytPlayer = new YT.Player('ytPlayer', {
        height: '100%',
        width: '100%',
        playerVars: {
          autoplay: 1,
          playsinline: 1,
          enablejsapi: 1,
          origin: window.location.origin || '*'
        },
        events: {
          onReady: (event) => {
            isPlayerReady = true;
            event.target.setVolume(parseFloat(musicVolSlider.value) * 100);
          },
          onStateChange: (event) => {
            if (event.data === YT.PlayerState.ENDED) {
              playNextSong();
            }
          }
        }
      });
    };

    function playVideo(videoId) {
      if (!isPlayerReady || !ytPlayer) {
        setTimeout(() => playVideo(videoId), 500);
        return;
      }
      unmuteTip.style.display = 'block';

      try {
        ytPlayer.loadVideoById(videoId);
        ytPlayer.setVolume(parseFloat(musicVolSlider.value) * 100);
        ytPlayer.playVideo();
      } catch (e) {
        console.warn('播放被攔截，點擊提示解除限制', e);
      }
    }

    unmuteTip.addEventListener('click', () => {
      if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
        ytPlayer.playVideo();
        ytPlayer.setVolume(parseFloat(musicVolSlider.value) * 100);
      }
      unmuteTip.style.display = 'none';
    });

    function playTrackAtIndex(index) {
      if (index >= 0 && index < playlist.length) {
        currentSongIndex = index;
        renderPlaylist();
        playVideo(playlist[currentSongIndex].id);
      }
    }

    function playNextSong() {
      if (currentSongIndex + 1 < playlist.length) {
        playTrackAtIndex(currentSongIndex + 1);
        broadcastState();
      } else {
        alert('舞廳曲目已全數播畢！');
      }
    }

    nextSongBtn.addEventListener('click', playNextSong);

    addQueueBtn.addEventListener('click', () => {
      const url = ytUrlInput.value.trim();
      const videoId = extractVideoID(url);
      if (!videoId) {
        alert('請輸入合法的 YouTube 網址！');
        return;
      }

      const songItem = { id: videoId, title: '伴奏曲目 (' + videoId.substring(0, 6) + ')' };
      playlist.push(songItem);
      ytUrlInput.value = '';

      if (currentSongIndex === -1) {
        currentSongIndex = 0;
        playTrackAtIndex(0);
      } else {
        renderPlaylist();
      }
      broadcastState();
    });

    /* ====================================================
       3. PeerJS 連線與多端即時廣播
       ==================================================== */
    let peer = null;
    let connections = [];
    const roomStatus = document.getElementById('roomStatus');
    const createRoomBtn = document.getElementById('createRoomBtn');
    const joinRoomBtn = document.getElementById('joinRoomBtn');
    const joinRoomInput = document.getElementById('joinRoomInput');
    const remoteAudio = document.getElementById('remoteAudio');

    function broadcastState() {
      const payload = {
        type: 'SYNC_STATE',
        playlist: playlist,
        currentSongIndex: currentSongIndex
      };
      connections.forEach(conn => {
        if (conn && conn.open) conn.send(payload);
      });
    }

    function handleIncomingData(data) {
      if (data.type === 'SYNC_STATE') {
        playlist = data.playlist || [];
        const prevIndex = currentSongIndex;
        currentSongIndex = data.currentSongIndex;
        renderPlaylist();

        if (currentSongIndex !== -1 && currentSongIndex !== prevIndex) {
          if (playlist[currentSongIndex]) {
            playVideo(playlist[currentSongIndex].id);
          }
        }
      }
    }

    function setupDataConnection(conn) {
      connections.push(conn);
      conn.on('open', () => {
        roomStatus.innerHTML = '<span style="color:var(--neon-cyan);">⚡ 已接入舞廳連線 (CONNECTED)</span>';
        conn.send({
          type: 'SYNC_STATE',
          playlist: playlist,
          currentSongIndex: currentSongIndex
        });
      });
      conn.on('data', handleIncomingData);
      conn.on('close', () => {
        connections = connections.filter(c => c !== conn);
      });
    }

    function setupPeer() {
      if (!peer) {
        peer = new Peer();

        peer.on('call', async (call) => {
          await ensureAudioContext();
          if (!micStream) {
            micStream = await navigator.mediaDevices.getUserMedia({
              audio: { echoCancellation: false, latency: 0 }
            });
          }
          call.answer(micStream);
          call.on('stream', (remoteStream) => {
            remoteAudio.srcObject = remoteStream;
          });
        });

        peer.on('connection', setupDataConnection);
      }
    }

    createRoomBtn.addEventListener('click', () => {
      setupPeer();
      peer.on('open', (id) => {
        roomStatus.innerHTML = `舞廳包廂代碼：<br><strong style="color:var(--neon-pink);font-family:'Orbitron';font-size:1.1rem;letter-spacing:1px;">${id}</strong>`;
      });
    });

    joinRoomBtn.addEventListener('click', async () => {
      const targetId = joinRoomInput.value.trim();
      if (!targetId) {
        alert('請輸入包廂代碼！');
        return;
      }
      setupPeer();
      await ensureAudioContext();
      if (!micStream) {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, latency: 0 }
        });
      }

      const conn = peer.connect(targetId);
      setupDataConnection(conn);

      const call = peer.call(targetId, micStream);
      call.on('stream', (remoteStream) => {
        remoteAudio.srcObject = remoteStream;
      });

      roomStatus.innerHTML = `<span style="color:var(--neon-cyan);">⚡ 已接入包廂通道：${targetId}</span>`;
    });
  </script>
</body>
</html>
