<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>多人連線口袋 KTV</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .ktv-card {
      background: #1e1e1e;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    h1 {
      margin-top: 0;
      font-size: 1.4rem;
      text-align: center;
      color: #ff3366;
    }
    .warning {
      background: #4a2600;
      color: #ffb86c;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      line-height: 1.4;
      margin-bottom: 14px;
      border-left: 4px solid #ff9900;
    }
    .section {
      background: #2a2a2a;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .section-title {
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      background: #ff3366;
      color: white;
      transition: background 0.2s;
    }
    button:active {
      opacity: 0.8;
    }
    button.active {
      background: #00cc88;
    }
    .btn-secondary {
      background: #444;
      width: auto;
      padding: 8px 12px;
      font-size: 0.85rem;
    }
    .btn-secondary:hover {
      background: #555;
    }
    .btn-next {
      background: #e67e22;
      width: 100%;
      margin-top: 8px;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 0.85rem;
      background: #222;
      padding: 8px 10px;
      border-radius: 8px;
    }
    .control-row span {
      min-width: 85px;
    }
    .val-display {
      min-width: 40px;
      text-align: right;
      color: #aaa;
      font-size: 0.8rem;
    }
    input[type="range"] {
      flex: 1;
      margin: 0 10px;
      accent-color: #ff3366;
    }
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    input[type="text"] {
      flex: 1;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #181818;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #ff3366;
    }
    .room-status {
      font-size: 0.8rem;
      color: #00cc88;
      margin-top: 8px;
      word-break: break-all;
    }
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 10px;
      background: #000;
      margin-top: 10px;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .mobile-unmute-tip {
      background: #2c3e50;
      color: #ecf0f1;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      text-align: center;
      margin-top: 8px;
      cursor: pointer;
      display: none;
      border: 1px solid #3498db;
    }
    /* 待播清單樣式 */
    .playlist-box {
      margin-top: 12px;
      background: #1e1e1e;
      border-radius: 8px;
      padding: 10px;
      max-height: 180px;
      overflow-y: auto;
    }
    .playlist-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      padding: 6px 8px;
      border-bottom: 1px solid #333;
    }
    .playlist-item:last-child {
      border-bottom: none;
    }
    .playlist-item.current {
      color: #00cc88;
      font-weight: bold;
    }
    .empty-list {
      color: #777;
      text-align: center;
      font-size: 0.8rem;
      padding: 8px;
    }
    #remoteAudio {
      display: none;
    }
  </style>
</head>
<body>

  <div class="ktv-card">
    <h1>🎤 多人連線口袋 KTV</h1>

    <div class="warning">
      ⚠️ <strong>必須戴上有線耳機！</strong> 使用喇叭會引發尖叫迴授嘯叫。
    </div>

    <!-- 1. 混音控制台 -->
    <div class="section">
      <div class="section-title">🎚️ 混音台：音量調整</div>
      <button id="micToggleBtn">開啟耳返監聽</button>
      
      <div class="control-row">
        <span>🎙️ 耳返音量</span>
        <input type="range" id="micVolume" min="0" max="2" step="0.05" value="1">
        <span class="val-display" id="micVal">100%</span>
      </div>

      <div class="control-row">
        <span>🎵 歌曲伴奏</span>
        <input type="range" id="musicVolume" min="0" max="1" step="0.05" value="0.8">
        <span class="val-display" id="musicVal">80%</span>
      </div>
    </div>

    <!-- 2. 線上包廂 -->
    <div class="section">
      <div class="section-title">👥 好友連線包廂</div>
      <button class="btn-secondary" id="createRoomBtn" style="width: 100%; margin-bottom: 8px;">建立新包廂（我是房長）</button>
      
      <div class="input-group">
        <input type="text" id="joinRoomInput" placeholder="輸入好友的包廂代碼">
        <button class="btn-secondary" id="joinRoomBtn">加入包廂</button>
      </div>
      <div class="room-status" id="roomStatus">尚未連線</div>
    </div>

    <!-- 3. YouTube 點播與播放器 -->
    <div class="section">
      <div class="section-title">🎵 伴奏歌曲與播放區</div>
      
      <div class="input-group">
        <input type="text" id="ytUrlInput" placeholder="貼上 YouTube 伴奏/KTV 網址">
        <button class="btn-secondary" id="addQueueBtn">加入歌單</button>
      </div>

      <!-- 手機端防阻擋提示 -->
      <div class="mobile-unmute-tip" id="unmuteTip">
        👉 偵測到新歌曲！若畫面未自動播放，請點此解鎖同步影音 🔊
      </div>

      <div class="video-wrapper" id="videoWrapper">
        <div id="ytPlayer"></div>
      </div>

      <button class="btn-next" id="nextSongBtn">⏭️ 切歌 / 下一首</button>

      <!-- 待播清單 -->
      <div class="section-title" style="margin-top: 14px; font-size: 0.85rem;">📋 待播清單佇列</div>
      <div class="playlist-box" id="playlistBox">
        <div class="empty-list">目前歌單是空的，快貼上伴奏網址加入吧！</div>
      </div>
    </div>
  </div>

  <audio id="remoteAudio" autoplay playsinline></audio>

  <!-- 外部函式庫 -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    /* ====================================================
       1. 音訊核心與麥克風耳返 (Web Audio API)
       ==================================================== */
    let audioCtx = null;
    let micStream = null;
    let micGainNode = null;
    let isMonitoring = false;

    const micBtn = document.getElementById('micToggleBtn');
    const micVolSlider = document.getElementById('micVolume');
    const micValDisplay = document.getElementById('micVal');
    const musicVolSlider = document.getElementById('musicVolume');
    const musicValDisplay = document.getElementById('musicVal');

    async function ensureAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass({ latencyHint: 'interactive', sampleRate: 48000 });
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }
    }

    micBtn.addEventListener('click', async () => {
      await ensureAudioContext();
      if (!isMonitoring) {
        try {
          if (!micStream) {
            micStream = await navigator.mediaDevices.getUserMedia({
              audio: { echoCancellation: false, autoGainControl: false, noiseSuppression: false, latency: 0 }
            });
          }
          const micSource = audioCtx.createMediaStreamSource(micStream);
          micGainNode = audioCtx.createGain();
          micGainNode.gain.value = parseFloat(micVolSlider.value);
          micSource.connect(micGainNode);
          micGainNode.connect(audioCtx.destination);

          isMonitoring = true;
          micBtn.textContent = '🔊 耳返已開啟（點此關閉）';
          micBtn.classList.add('active');
        } catch (err) {
          alert('無法開啟麥克風，請檢查權限！');
        }
      } else {
        if (micStream) {
          micStream.getTracks().forEach(t => t.stop());
          micStream = null;
        }
        isMonitoring = false;
        micBtn.textContent = '開啟耳返監聽';
        micBtn.classList.remove('active');
      }
    });

    micVolSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      micValDisplay.textContent = Math.round(val * 100) + '%';
      if (micGainNode) micGainNode.gain.value = val;
    });

    musicVolSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      musicValDisplay.textContent = Math.round(val * 100) + '%';
      if (ytPlayer && typeof ytPlayer.setVolume === 'function') {
        ytPlayer.setVolume(val * 100);
      }
    });

    /* ====================================================
       2. 播放清單佇列資料結構
       ==================================================== */
    let playlist = []; // 結構: [{ id: 'xxx', title: 'Song 1' }]
    let currentSongIndex = -1;

    const playlistBox = document.getElementById('playlistBox');
    const unmuteTip = document.getElementById('unmuteTip');

    function renderPlaylist() {
      if (playlist.length === 0) {
        playlistBox.innerHTML = '<div class="empty-list">目前歌單是空的，快貼上伴奏網址加入吧！</div>';
        return;
      }
      let html = '';
      playlist.forEach((item, index) => {
        let tag = '';
        let className = 'playlist-item';
        if (index === currentSongIndex) {
          tag = '【正在播放】';
          className += ' current';
        } else if (index === currentSongIndex + 1) {
          tag = '【下一首】';
        } else {
          tag = `#${index + 1}`;
        }
        html += `<div class="${className}"><span>${tag} ${item.title || item.id}</span></div>`;
      });
      playlistBox.innerHTML = html;
    }

    /* ====================================================
       3. YouTube 播放器與多端同步
       ==================================================== */
    let ytPlayer = null;
    let isPlayerReady = false;
    const videoWrapper = document.getElementById('videoWrapper');
    const ytUrlInput = document.getElementById('ytUrlInput');
    const addQueueBtn = document.getElementById('addQueueBtn');
    const nextSongBtn = document.getElementById('nextSongBtn');

    function extractVideoID(url) {
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      return match ? match[1] : null;
    }

    // 初始化 YouTube 播放器
    window.onYouTubeIframeAPIReady = function() {
      ytPlayer = new YT.Player('ytPlayer', {
        height: '100%',
        width: '100%',
        playerVars: {
          autoplay: 1,
          playsinline: 1,
          enablejsapi: 1,
          origin: window.location.origin || '*'
        },
        events: {
          onReady: (event) => {
            isPlayerReady = true;
            event.target.setVolume(parseFloat(musicVolSlider.value) * 100);
          },
          onStateChange: (event) => {
            // 當歌曲唱完時 (0 = YT.PlayerState.ENDED)，自動播放下一首
            if (event.data === YT.PlayerState.ENDED) {
              playNextSong();
            }
          }
        }
      });
    };

    function playVideo(videoId) {
      if (!isPlayerReady || !ytPlayer) {
        setTimeout(() => playVideo(videoId), 500);
        return;
      }
      unmuteTip.style.display = 'block'; // 顯示提示讓手機觸碰解鎖

      try {
        ytPlayer.loadVideoById(videoId);
        ytPlayer.setVolume(parseFloat(musicVolSlider.value) * 100);
        ytPlayer.playVideo();
      } catch (e) {
        console.warn('播放被攔截，等待使用者點擊解鎖', e);
      }
    }

    // 解鎖按鈕（iOS / 手機點一下即可強制發聲）
    unmuteTip.addEventListener('click', () => {
      if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
        ytPlayer.playVideo();
        ytPlayer.setVolume(parseFloat(musicVolSlider.value) * 100);
      }
      unmuteTip.style.display = 'none';
    });

    // 播放指定索引的歌曲
    function playTrackAtIndex(index) {
      if (index >= 0 && index < playlist.length) {
        currentSongIndex = index;
        renderPlaylist();
        playVideo(playlist[currentSongIndex].id);
      }
    }

    // 切歌 / 播下一首
    function playNextSong() {
      if (currentSongIndex + 1 < playlist.length) {
        playTrackAtIndex(currentSongIndex + 1);
        broadcastState(); // 同步給其他人
      } else {
        alert('待播清單已經唱完囉！');
      }
    }

    nextSongBtn.addEventListener('click', () => {
      playNextSong();
    });

    // 加入歌單
    addQueueBtn.addEventListener('click', () => {
      const url = ytUrlInput.value.trim();
      const videoId = extractVideoID(url);
      if (!videoId) {
        alert('請輸入有效的 YouTube 伴奏連結！');
        return;
      }

      const songItem = { id: videoId, title: 'YouTube 伴奏 (' + videoId.substring(0, 5) + ')' };
      playlist.push(songItem);
      ytUrlInput.value = '';

      // 若目前沒有歌在播，直接開始播這首
      if (currentSongIndex === -1) {
        currentSongIndex = 0;
        playTrackAtIndex(0);
      } else {
        renderPlaylist();
      }

      broadcastState();
    });

    /* ====================================================
       4. PeerJS 雙向多端同步網路層
       ==================================================== */
    let peer = null;
    let connections = []; // 保存所有連線中的頻道
    const roomStatus = document.getElementById('roomStatus');
    const createRoomBtn = document.getElementById('createRoomBtn');
    const joinRoomBtn = document.getElementById('joinRoomBtn');
    const joinRoomInput = document.getElementById('joinRoomInput');
    const remoteAudio = document.getElementById('remoteAudio');

    // 廣播最新歌單與播放進度給包廂所有人
    function broadcastState() {
      const payload = {
        type: 'SYNC_STATE',
        playlist: playlist,
        currentSongIndex: currentSongIndex
      };
      connections.forEach(conn => {
        if (conn && conn.open) {
          conn.send(payload);
        }
      });
    }

    function handleIncomingData(data) {
      if (data.type === 'SYNC_STATE') {
        playlist = data.playlist || [];
        const prevIndex = currentSongIndex;
        currentSongIndex = data.currentSongIndex;
        renderPlaylist();

        // 如果歌曲切換了，同步載入播放
        if (currentSongIndex !== -1 && currentSongIndex !== prevIndex) {
          if (playlist[currentSongIndex]) {
            playVideo(playlist[currentSongIndex].id);
          }
        }
      }
    }

    function setupDataConnection(conn) {
      connections.push(conn);
      conn.on('open', () => {
        roomStatus.textContent = '🟢 已成功建立雙向包廂同步！';
        // 一連線立刻把目前的歌單同步給新加入的人
        conn.send({
          type: 'SYNC_STATE',
          playlist: playlist,
          currentSongIndex: currentSongIndex
        });
      });
      conn.on('data', (data) => {
        handleIncomingData(data);
      });
      conn.on('close', () => {
        connections = connections.filter(c => c !== conn);
      });
    }

    function setupPeer() {
      if (!peer) {
        peer = new Peer();

        // 接收語音通話
        peer.on('call', async (call) => {
          await ensureAudioContext();
          if (!micStream) {
            micStream = await navigator.mediaDevices.getUserMedia({
              audio: { echoCancellation: false, latency: 0 }
            });
          }
          call.answer(micStream);
          call.on('stream', (remoteStream) => {
            remoteAudio.srcObject = remoteStream;
          });
        });

        // 接收資料頻道 (房長接收手機端的連線)
        peer.on('connection', (conn) => {
          setupDataConnection(conn);
        });
      }
    }

    // 房長建立包廂
    createRoomBtn.addEventListener('click', () => {
      setupPeer();
      peer.on('open', (id) => {
        roomStatus.innerHTML = `包廂已建立！手機請輸入此代碼：<br><strong style="color:#ff3366;font-size:1.15rem;">${id}</strong>`;
      });
    });

    // 手機加入包廂
    joinRoomBtn.addEventListener('click', async () => {
      const targetId = joinRoomInput.value.trim();
      if (!targetId) {
        alert('請輸入包廂代碼！');
        return;
      }
      setupPeer();
      await ensureAudioContext();
      if (!micStream) {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, latency: 0 }
        });
      }

      // 建立同步頻道
      const conn = peer.connect(targetId);
      setupDataConnection(conn);

      // 發起麥克風對講通話
      const call = peer.call(targetId, micStream);
      call.on('stream', (remoteStream) => {
        remoteAudio.srcObject = remoteStream;
      });

      roomStatus.textContent = `🟢 已連線至包廂：${targetId}`;
    });
  </script>
</body>
</html>
